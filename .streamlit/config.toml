[theme]
base = "dark"
primaryColor = "#00F2FE"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#131C2E"
textColor = "#E2E8F0"
borderColor = "#22324A"
linkColor = "#00F2FE"
redColor = "#F87171"
greenColor = "#10B981"
yellowColor = "#FBBF24"
violetColor = "#A78BFA"
codeBackgroundColor = "#070B14"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap, monospace"
baseRadius = "10px"
showWidgetBorder = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
